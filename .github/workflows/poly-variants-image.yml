name: Polymorphic variants dev container image

on:
  push:
    branches: [poly-variants]
    paths:
      - 'src/**'
      - 'eng/**'
      - 'global.json'
      - '.devcontainer/poly-variants/**'
      - '.github/workflows/poly-variants-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/jaggerjo/fsharp-poly-variants-demo

jobs:
  image:
    if: github.repository == 'JaggerJo/fsharp'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/poly-variants/Dockerfile
          platforms: linux/amd64
          load: true
          tags: poly-variants-demo:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: docker run --rm poly-variants-demo:test /opt/fsharp-pv/smoke-test/run.sh

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/poly-variants/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
